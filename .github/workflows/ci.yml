name: nf-test

on:
  pull_request:
    branches:
      - main

jobs:
  nf-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.6"

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash -s 0.9.5
          sudo mv nf-test /usr/local/bin/

      - name: Run nf-test
        run: |
          nf-test test --ci
